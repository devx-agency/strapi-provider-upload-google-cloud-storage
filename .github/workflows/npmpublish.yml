name: NPM build and push

on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - name: Install dependencies
        run: yarn install
      - name: Build the plugin
        run: yarn build:prod
      - name: Get the release tag version
        id: get_version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_OUTPUT"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Set package version
        run: yarn version --new-version "${{ steps.get_version.outputs.VERSION }}" --no-git-tag-version
      - name: Stage package for approval
        if: '!github.event.release.prerelease'
        run: npm stage publish --access public --tag "${{ steps.get_version.outputs.DIST_TAG }}" --registry=https://registry.npmjs.org/
